# Round 3 (pre-registered): 6-tap M2-CL, alpha matched to the authors' gradient share (AUDIT F12), paper lr
model: m2cl
arch_taps: 6
alpha: 0.07
tau: 1.0
loss_reduction: sum
augmentation: baseline
epochs: 30
batch_size: 128
lr: 0.001
momentum: 0.9
weight_decay: 0.0005
targets: [art_painting, cartoon, photo, sketch]
seeds: [0, 1, 2]          # add 3, 4 if GPU time allows (recommended for the paper)
