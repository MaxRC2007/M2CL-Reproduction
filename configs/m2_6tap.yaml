# Missing ablation: 6-tap M2, identical except the contrastive loss is off
model: m2
arch_taps: 6
alpha: 0.0            # no contrastive term -> tap-matched M2 ablation
tau: 1.0
loss_reduction: sum
augmentation: baseline
epochs: 30
batch_size: 128
lr: 0.0005
momentum: 0.9
weight_decay: 0.0005
targets: [art_painting, cartoon, photo, sketch]
seeds: [0, 1, 2]          # add 3, 4 if GPU time allows (recommended for the paper)
